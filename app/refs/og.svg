<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f1f2ed"/>

  <!-- hairline measure grid -->
  <g stroke="#c7cac0" stroke-width="1" opacity="0.55">
    <line x1="96" y1="0" x2="96" y2="630"/>
    <line x1="192" y1="0" x2="192" y2="630"/>
    <line x1="288" y1="0" x2="288" y2="630"/>
    <line x1="384" y1="0" x2="384" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="576" y1="0" x2="576" y2="630"/>
    <line x1="672" y1="0" x2="672" y2="630"/>
    <line x1="768" y1="0" x2="768" y2="630"/>
    <line x1="864" y1="0" x2="864" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1056" y1="0" x2="1056" y2="630"/>
  </g>

  <!-- mark -->
  <g transform="translate(72 56)">
    <circle cx="30" cy="30" r="27" fill="none" stroke="#151a21" stroke-width="2"/>
    <g stroke="#151a21" stroke-width="1.4" opacity="0.5">
      <line x1="30" y1="4" x2="30" y2="10"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(45 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(90 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(135 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(180 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(225 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(270 30 30)"/>
      <line x1="30" y1="4" x2="30" y2="10" transform="rotate(315 30 30)"/>
    </g>
    <line x1="30" y1="28" x2="30" y2="8" stroke="#2438c9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="3.5" fill="#151a21"/>
  </g>
  <text x="146" y="90" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="23" letter-spacing="6" fill="#151a21">BANDWISE</text>

  <!-- headline -->
  <text x="72" y="250" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#151a21">Practise under</text>
  <text x="72" y="336" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#151a21">real exam conditions.</text>

  <text x="72" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#3d4550">Four modules, ten stored mocks in each, and a marking</text>
  <text x="72" y="436" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" fill="#3d4550">engine that explains every wrong answer.</text>

  <!-- dial -->
  <g transform="translate(930 300)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#c7cac0" stroke-width="2"/>
    <path d="M -120 90 A 150 150 0 1 1 120 90" fill="none" stroke="#c7cac0" stroke-width="2"/>
    <g stroke="#9aa096" stroke-width="2">
      <line x1="0" y1="-146" x2="0" y2="-126"/>
      <line x1="0" y1="-146" x2="0" y2="-126" transform="rotate(60 0 0)"/>
      <line x1="0" y1="-146" x2="0" y2="-126" transform="rotate(120 0 0)"/>
      <line x1="0" y1="-146" x2="0" y2="-126" transform="rotate(180 0 0)"/>
      <line x1="0" y1="-146" x2="0" y2="-126" transform="rotate(240 0 0)"/>
      <line x1="0" y1="-146" x2="0" y2="-126" transform="rotate(300 0 0)"/>
    </g>
    <line x1="0" y1="0" x2="86" y2="-62" stroke="#2438c9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#151a21"/>
    <text x="0" y="86" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#151a21">7.0</text>
    <text x="0" y="116" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#6b7280">ESTIMATED BAND</text>
  </g>

  <line x1="72" y1="530" x2="1128" y2="530" stroke="#c7cac0" stroke-width="1"/>
  <text x="72" y="570" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="2" fill="#6b7280">READING · LISTENING · SPEAKING · WRITING</text>
  <text x="1128" y="570" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" letter-spacing="2" fill="#6b7280">PRACTICE MARKING ONLY</text>
</svg>
